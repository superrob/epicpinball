# Epic Pinball for DOF: an example. 120 is Pinscape Pico unit 1 (121 unit 2).
#
# To use it, copy it to saves/directoutputconfig/ and make the rows your own:
# as it is, outputs 1 to 7 would fire. There it takes the place of VPinball's
# ini files, for this game only. docs/cabinet-feedback.md has the whole of it.
#
# You may not need it: with no epicpinball row anywhere, the helper makes one
# from the device list a Config Tool export has after [Config DOF].
#
# THE GAME LIMITS NOTHING. Set time limits in the controller before any coil.
#
# One column per output, from 1 (an RGB column takes three), 0 for none.
# Each event has a name, written with a $:
#   $FlipperLeft     $Bumper1 ... $Bumper6   $Tilt          $GameStart
#   $FlipperRight    $Launch                 $ExtraBall     $GameOver
#   $SlingshotLeft   $BallRelease            $BallReady     $Multiball
#   $SlingshotRight  $Drain                  $Nudge
# On a table with features of its own (table 1 so far), also:
#   $BallHeld  $LanesLit  $SkillShot  $Jackpot  $SuperJackpot  $Award
# and that table's own holes, ramps, lanes and targets, named t1 and the
# feature: $t1PowerUpHole, $t1LeftRamp, $t1DropTargetsDown ...
# Bumpers are numbered from the left; all of it in docs/cabinet-feedback.md.
#
# $FlipperLeft 50        a pulse of 50 ms as the flipper starts up
# $FlipperLeft           on for as long as the flipper is up (coils made to be held)
# $SlingshotLeft 50 I32  50 ms at two thirds of full (intensities go to 48)
#
# Only # starts a comment, and without a colour the whole file is ignored.

[Colors DOF]
White=48,48,48

[Config DOF]
epicpinball,$FlipperLeft 50,$FlipperRight 50,$SlingshotLeft 50,$SlingshotRight 50,$Bumper1 50,$Bumper2 50,$Bumper3 50
# A row for one table replaces the row above on that table (ep01 to ep13):
#epicpinball_ep07,$FlipperLeft 50,$FlipperRight 50,$SlingshotLeft 50 I32,$SlingshotRight 50 I32,$Bumper1 50,$Bumper2 50,$Bumper3 50
