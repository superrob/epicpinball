# Epic Pinball for DOF: an example. 120 is Pinscape Pico unit 1 (121 unit 2).
#
# To use it, copy it to saves/directoutputconfig/ and make the rows your own:
# as it is, outputs 1 to 7 would fire. There it takes the place of VPinball's
# ini files, for this game only. docs/cabinet-feedback.md has the whole of it.
#
# You may not need it: with no epicpinball row anywhere, the helper makes one
# from the device list a Config Tool export has after [Config DOF].
#
# THE GAME LIMITS NOTHING. Set time limits in the controller before any coil.
#
# One column per output, from 1 (an RGB column takes three), 0 for none.
#   E101 flipper_left   E106 bumper_2       E111 nudge         E116 game_start
#   E102 flipper_right  E107 bumper_3       E112 tilt          E117 game_over
#   E103 sling_left     E108 launch         E113 knocker       E118 bumper_4
#   E104 sling_right    E109 ball_release   E114 ball_ready    E119 bumper_5
#   E105 bumper_1       E110 drain          E115 multiball     E120 bumper_6
# A table's own features, table 1 only so far:
#   E121-E125 hole_1-5 (a kick-out)   E132-E137 rollover_1-6    E143 jackpot
#   E126 ball_held                    E138 lanes_lit            E144 super_jackpot
#   E127 kickback                     E139 skill_shot           E145 award
#   E128-E130 target_1-3              E140-E142 ramp_1-3
#   E131 targets_down
# A table's bumpers and features are numbered from the left: docs/cabinet-feedback.md.
#
# E101 50      a pulse of 50 ms as the flipper starts up
# E101         on for as long as the flipper is up (coils made to be held)
# E103 50 I32  50 ms at two thirds of full (intensities go to 48)
#
# Only # starts a comment, and without a colour the whole file is ignored.

[Colors DOF]
White=48,48,48

[Config DOF]
epicpinball,E101 50,E102 50,E103 50,E104 50,E105 50,E106 50,E107 50
# A row for one table replaces the row above on that table (ep01 to ep13):
#epicpinball_ep07,E101 50,E102 50,E103 50 I32,E104 50 I32,E105 50,E106 50,E107 50
